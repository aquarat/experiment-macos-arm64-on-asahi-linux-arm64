<text x="567.1" y="229.0" font-size="11" fill="#6b6a65" text-anchor="middle">2</text>
<line x1="652.6" y1="112.0" x2="652.6" y2="214.0" stroke="#e8e7e1" stroke-width="1"/>
<text x="652.6" y="229.0" font-size="11" fill="#6b6a65" text-anchor="middle">2.5</text>
<text x="215.0" y="133.5" font-size="12.5" fill="#0b0b0b" text-anchor="end">GPU, worker, no compaction</text>
