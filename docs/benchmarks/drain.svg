<svg xmlns="http://www.w3.org/2000/svg" width="780" height="802" viewBox="0 0 780 802" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Reims drain behaviour over a UI-test session</title>
<desc>Drain ranges per build: drain_busy gpu-worker-nocompact 1032-1200 s; drain_busy candidate 499-529 s; drain_busy gpu-main-compact 472-484 s; tranche_p50 gpu-worker-nocompact 117-214 ms; tranche_p50 candidate 30-41 ms; tranche_p50 gpu-main-compact 36-42 ms; tranche_p90 gpu-worker-nocompact 1.8-2.2 s; tranche_p90 candidate 0.56-1.5 s; tranche_p90 gpu-main-compact 0.068-0.072 s; tranche_max gpu-worker-nocompact 6.2-9.7 s; tranche_max candidate 2.6-3.5 s; tranche_max gpu-main-compact 1-1 s; vcpu_wait_total gpu-worker-nocompact 100-135 s; vcpu_wait_total candidate 17-19 s; vcpu_wait_total gpu-main-compact 0-0 s; vcpu_wait_max gpu-worker-nocompact 1.3-2.3 s; vcpu_wait_max candidate 0.34-0.65 s; vcpu_wait_max gpu-main-compact 0-0 s</desc>
<rect x="0.5" y="0.5" width="779" height="801" rx="10" fill="#fcfcfb" stroke="#dddcd5"/>
