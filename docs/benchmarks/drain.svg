<text x="22.0" y="57.0" font-size="12.5" fill="#52514e" text-anchor="start">How long the device's command drain runs without a break (a tranche), how long vCPUs</text>
<text x="22.0" y="76.0" font-size="12.5" fill="#52514e" text-anchor="start">wait for the device lock, and total drain busy time. Capsules span the runs of each build.</text>
